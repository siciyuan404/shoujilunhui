name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/release
        run: cp app-release.apk shoujilunhui-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-recycle-android
          path: android/app/build/outputs/apk/release/shoujilunhui-*.apk

      - name: Release to GitHub (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/shoujilunhui-*.apk
